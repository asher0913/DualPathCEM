name: Snapshot checks

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
      - name: Install package
        run: pip install -e '.[dev]'
      - name: Compile Python sources
        run: python -m compileall -q src scripts tests
      - name: Run tests
        run: pytest -q
      - name: Verify public snapshot
        run: python scripts/verify_showcase.py
